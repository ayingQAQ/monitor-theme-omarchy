name: Check and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Test, build and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Validate release metadata
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const theme=JSON.parse(fs.readFileSync('theme.json','utf8'));
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          assert.equal(theme.version,pkg.version,'Theme/package versions must match');
          if(process.env.RELEASE_TAG) {
            assert.match(process.env.RELEASE_TAG,/^v\d+\.\d+\.\d+$/,'Use a stable vX.Y.Z tag');
            assert.equal(process.env.RELEASE_TAG,`v${theme.version}`,'Tag/theme version mismatch');
            assert.equal(theme.url,`https://github.com/${process.env.GITHUB_REPOSITORY}`,'Incorrect theme repository');
            assert.ok(theme.author.trim(),'Release author must be set');
          }
          NODE
      - run: npm ci
      - run: npm test
      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Browser regression tests
        run: npm run test:e2e
      - name: Build and verify theme archive
        run: npm run package
      - name: Verify production runtime
        run: node scripts/smoke-production.mjs
      - name: Verify checksum
        run: sha256sum -c theme.tar.gz.sha256
      - name: Save release files
        uses: actions/upload-artifact@v7.0.2
        with:
          name: theme-${{ github.sha }}
          path: |
            theme.tar.gz
            theme.tar.gz.sha256
            preview.png
          if-no-files-found: error
          retention-days: 14
      - name: Save failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-results-${{ github.sha }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish formal Release
    needs: check
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: theme-${{ github.sha }}
          path: release-files
      - name: Verify downloaded archive
        working-directory: release-files
        run: |
          sha256sum -c theme.tar.gz.sha256
          gzip -t theme.tar.gz
      - name: Create and publish Release
        shell: bash
        run: |
          set -euo pipefail
          notes="docs/releases/$RELEASE_TAG.md"
          if existing=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$existing" != true ]]; then
              echo "Release $RELEASE_TAG is already public; refusing to replace published files."
              exit 1
            fi
            gh release upload "$RELEASE_TAG" release-files/theme.tar.gz release-files/theme.tar.gz.sha256 release-files/preview.png --clobber
          else
            args=(--verify-tag --draft --title "$RELEASE_TAG · Omarchy for Monitor")
            if [[ -f "$notes" ]]; then
              args+=(--notes-file "$notes")
            else
              args+=(--generate-notes)
            fi
            gh release create "$RELEASE_TAG" release-files/theme.tar.gz release-files/theme.tar.gz.sha256 release-files/preview.png "${args[@]}"
          fi
          gh release edit "$RELEASE_TAG" --draft=false --latest
